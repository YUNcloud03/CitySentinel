<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1230" viewBox="0 0 1480 1230" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif">
  <defs>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 5 0 L 10 8 L 5 6 L 0 8 Z" fill="#4a5563"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1480" height="1230" fill="#0e1012"/>

  <text x="60" y="64" font-size="30" font-weight="600" fill="#e8ecf1">CitySentinel 系統架構圖</text>
  <text x="60" y="96" font-size="15" fill="#8b95a3">六層架構 · 資料由下而上流動 · 稽核貫穿全層</text>
  <rect x="60" y="112" width="1380" height="1" fill="#2a3038"/>

  <!-- ========== 前端層 ========== -->
  <rect x="60" y="130" width="1120" height="110" rx="14" fill="#16191c" stroke="#2a3038"/>
  <text x="84" y="162" font-size="16" font-weight="600" fill="#e8ecf1">前端層　React 18 · TypeScript · Vite · MapLibre GL</text>
  <rect x="84" y="178" width="168" height="34" rx="8" fill="#1d2126" stroke="#2a3038"/>
  <text x="168" y="200" font-size="13" fill="#c8d0da" text-anchor="middle">總覽 · 3D 地球</text>
  <rect x="264" y="178" width="168" height="34" rx="8" fill="#1d2126" stroke="#2a3038"/>
  <text x="348" y="200" font-size="13" fill="#c8d0da" text-anchor="middle">指揮艙</text>
  <rect x="444" y="178" width="168" height="34" rx="8" fill="#1d2126" stroke="#2a3038"/>
  <text x="528" y="200" font-size="13" fill="#c8d0da" text-anchor="middle">監控</text>
  <rect x="624" y="178" width="168" height="34" rx="8" fill="#1d2126" stroke="#2a3038"/>
  <text x="708" y="200" font-size="13" fill="#c8d0da" text-anchor="middle">可驗證性</text>
  <rect x="804" y="178" width="168" height="34" rx="8" fill="#1d2126" stroke="#2a3038"/>
  <text x="888" y="200" font-size="13" fill="#c8d0da" text-anchor="middle">顧問對話</text>
  <rect x="984" y="178" width="168" height="34" rx="8" fill="#1d2126" stroke="#2a3038"/>
  <text x="1068" y="200" font-size="13" fill="#c8d0da" text-anchor="middle">民眾手機</text>

  <line x1="620" y1="285" x2="620" y2="248" stroke="#4a5563" stroke-width="1.5" marker-end="url(#arrowUp)"/>
  <text x="638" y="270" font-size="11.5" fill="#6b7684">JSON 回應 · 前端以 Zod 驗證後才進入 UI</text>

  <!-- ========== API 層 ========== -->
  <rect x="60" y="290" width="1120" height="80" rx="14" fill="#16191c" stroke="#2a3038"/>
  <text x="84" y="322" font-size="16" font-weight="600" fill="#e8ecf1">API 層　FastAPI（44 個端點）</text>
  <rect x="84" y="332" width="142" height="30" rx="8" fill="#1d2126" stroke="#2a3038"/>
  <text x="155" y="352" font-size="12.5" fill="#c8d0da" text-anchor="middle">事件</text>
  <rect x="238" y="332" width="142" height="30" rx="8" fill="#1d2126" stroke="#2a3038"/>
  <text x="309" y="352" font-size="12.5" fill="#c8d0da" text-anchor="middle">模擬</text>
  <rect x="392" y="332" width="142" height="30" rx="8" fill="#1d2126" stroke="#2a3038"/>
  <text x="463" y="352" font-size="12.5" fill="#c8d0da" text-anchor="middle">綠廊</text>
  <rect x="546" y="332" width="142" height="30" rx="8" fill="#1d2126" stroke="#2a3038"/>
  <text x="617" y="352" font-size="12.5" fill="#c8d0da" text-anchor="middle">沙盒</text>
  <rect x="700" y="332" width="142" height="30" rx="8" fill="#1d2126" stroke="#2a3038"/>
  <text x="771" y="352" font-size="12.5" fill="#c8d0da" text-anchor="middle">調度</text>
  <rect x="854" y="332" width="142" height="30" rx="8" fill="#1d2126" stroke="#2a3038"/>
  <text x="925" y="352" font-size="12.5" fill="#c8d0da" text-anchor="middle">通知</text>
  <rect x="1008" y="332" width="142" height="30" rx="8" fill="#1d2126" stroke="#2a3038"/>
  <text x="1079" y="352" font-size="12.5" fill="#c8d0da" text-anchor="middle">稽核</text>

  <line x1="620" y1="415" x2="620" y2="378" stroke="#4a5563" stroke-width="1.5" marker-end="url(#arrowUp)"/>
  <text x="638" y="400" font-size="11.5" fill="#6b7684">事件狀態 + 完整決策軌跡</text>

  <!-- ========== 協調層 ========== -->
  <rect x="60" y="420" width="1120" height="140" rx="14" fill="#16191c" stroke="#2a3038"/>
  <text x="84" y="452" font-size="16" font-weight="600" fill="#e8ecf1">協調層　流程控制與狀態管理</text>
  <rect x="84" y="466" width="349" height="78" rx="10" fill="#1d2126" stroke="#2a3038"/>
  <text x="102" y="494" font-size="14" fill="#e8ecf1">Coordinator 狀態機</text>
  <text x="102" y="515" font-size="11.5" fill="#8b95a3">11 步：驗證 → 判定 → 信心 → 路線</text>
  <text x="102" y="532" font-size="11.5" fill="#8b95a3">→ ETE → 調度 → 生成 → 發布 → 完成</text>
  <rect x="445" y="466" width="349" height="78" rx="10" fill="#1d2126" stroke="#2a3038"/>
  <text x="463" y="494" font-size="14" fill="#e8ecf1">通知中心</text>
  <text x="463" y="515" font-size="11.5" fill="#8b95a3">草稿 → 待審 → 核准 → 派送</text>
  <text x="463" y="532" font-size="11.5" fill="#8b95a3">→ 送達確認 / 失敗 → 重試</text>
  <rect x="806" y="466" width="349" height="78" rx="10" fill="#1d2126" stroke="#2a3038"/>
  <text x="824" y="494" font-size="14" fill="#e8ecf1">資源池</text>
  <text x="824" y="515" font-size="11.5" fill="#8b95a3">12 單位警力 · 僅能高優先搶佔低優先</text>
  <text x="824" y="532" font-size="11.5" fill="#8b95a3">雙邊留稽核 · 釋放後自動回填</text>

  <line x1="620" y1="605" x2="620" y2="568" stroke="#4a5563" stroke-width="1.5" marker-end="url(#arrowUp)"/>
  <text x="638" y="590" font-size="11.5" fill="#6b7684">判定結果 · 路線 · ETE · 調度方案 · 生成文字</text>

  <!-- ========== 決策核心 ========== -->
  <rect x="60" y="610" width="1120" height="170" rx="14" fill="#16191c" stroke="#2a3038"/>
  <text x="84" y="642" font-size="16" font-weight="600" fill="#e8ecf1">決策核心　職責切分：會影響行動的數字不出自機率模型</text>

  <rect x="84" y="656" width="700" height="108" rx="10" fill="#1d2126" stroke="#007afc" stroke-opacity="0.45"/>
  <text x="100" y="684" font-size="14" font-weight="600" fill="#007afc">確定性引擎　判定與計算</text>
  <rect x="100" y="698" width="101" height="34" rx="8" fill="#16191c" stroke="#2a3038"/>
  <text x="150" y="720" font-size="12" fill="#c8d0da" text-anchor="middle">規則判定</text>
  <rect x="213" y="698" width="101" height="34" rx="8" fill="#16191c" stroke="#2a3038"/>
  <text x="263" y="720" font-size="12" fill="#c8d0da" text-anchor="middle">路線規劃</text>
  <rect x="326" y="698" width="101" height="34" rx="8" fill="#16191c" stroke="#2a3038"/>
  <text x="376" y="720" font-size="12" fill="#c8d0da" text-anchor="middle">ETE 計算</text>
  <rect x="439" y="698" width="101" height="34" rx="8" fill="#16191c" stroke="#2a3038"/>
  <text x="489" y="720" font-size="12" fill="#c8d0da" text-anchor="middle">信心評分</text>
  <rect x="552" y="698" width="101" height="34" rx="8" fill="#16191c" stroke="#2a3038"/>
  <text x="602" y="720" font-size="12" fill="#c8d0da" text-anchor="middle">號誌配時</text>
  <rect x="665" y="698" width="101" height="34" rx="8" fill="#16191c" stroke="#2a3038"/>
  <text x="715" y="720" font-size="12" fill="#c8d0da" text-anchor="middle">資源調度</text>
  <text x="100" y="752" font-size="11" fill="#6b7684">每個輸出都附帶公式字串與觸發依據</text>

  <rect x="800" y="656" width="356" height="108" rx="10" fill="#1d2126" stroke="#2a3038"/>
  <text x="816" y="684" font-size="14" font-weight="600" fill="#c8d0da">LLM 層　只生文，不判定</text>
  <rect x="816" y="698" width="100" height="34" rx="8" fill="#16191c" stroke="#2a3038"/>
  <text x="866" y="720" font-size="11" fill="#c8d0da" text-anchor="middle">文字生成護欄</text>
  <rect x="928" y="698" width="100" height="34" rx="8" fill="#16191c" stroke="#2a3038"/>
  <text x="978" y="720" font-size="11" fill="#c8d0da" text-anchor="middle">Agent 唯讀工具</text>
  <rect x="1040" y="698" width="100" height="34" rx="8" fill="#16191c" stroke="#2a3038"/>
  <text x="1090" y="720" font-size="11" fill="#c8d0da" text-anchor="middle">顧問問答</text>
  <text x="816" y="752" font-size="11" fill="#6b7684">工具清單中不存在發布 / 派遣 / 核准</text>

  <line x1="620" y1="825" x2="620" y2="788" stroke="#4a5563" stroke-width="1.5" marker-end="url(#arrowUp)"/>
  <text x="638" y="810" font-size="11.5" fill="#6b7684">投影後的路網快照（原始資料不被改動）</text>

  <!-- ========== 模擬層 ========== -->
  <rect x="60" y="830" width="1120" height="140" rx="14" fill="#16191c" stroke="#2a3038"/>
  <text x="84" y="862" font-size="16" font-weight="600" fill="#e8ecf1">模擬層　不可變更生產狀態（此約束由自動化測試守著）</text>
  <rect x="84" y="876" width="204" height="78" rx="10" fill="#1d2126" stroke="#2a3038"/>
  <text x="102" y="904" font-size="13.5" fill="#e8ecf1">時間軸播放器</text>
  <text x="102" y="925" font-size="11.5" fill="#8b95a3">主辦方資料逐格重播</text>
  <text x="102" y="942" font-size="11.5" fill="#8b95a3">可暫停 · 可跳轉</text>
  <rect x="300" y="876" width="204" height="78" rx="10" fill="#1d2126" stroke="#2a3038"/>
  <text x="318" y="904" font-size="13.5" fill="#e8ecf1">事件投影</text>
  <text x="318" y="925" font-size="11.5" fill="#8b95a3">嚴重度 × 封閉 × 類型</text>
  <text x="318" y="942" font-size="11.5" fill="#8b95a3">× 時間爬升係數</text>
  <rect x="516" y="876" width="204" height="78" rx="10" fill="#1d2126" stroke="#2a3038"/>
  <text x="534" y="904" font-size="13.5" fill="#e8ecf1">決策沙盒</text>
  <text x="534" y="925" font-size="11.5" fill="#8b95a3">四措施 × 四突發</text>
  <text x="534" y="942" font-size="11.5" fill="#8b95a3">全網 before / after</text>
  <rect x="732" y="876" width="204" height="78" rx="10" fill="#1d2126" stroke="#2a3038"/>
  <text x="750" y="904" font-size="13.5" fill="#e8ecf1">救護綠廊</text>
  <text x="750" y="925" font-size="11.5" fill="#8b95a3">路口對路口路徑規劃</text>
  <text x="750" y="942" font-size="11.5" fill="#8b95a3">滾動優先 + 通過還原</text>
  <rect x="948" y="876" width="204" height="78" rx="10" fill="#1d2126" stroke="#2a3038"/>
  <text x="966" y="904" font-size="13.5" fill="#e8ecf1">What-If 推演</text>
  <text x="966" y="925" font-size="11.5" fill="#8b95a3">情境沙盒</text>
  <text x="966" y="942" font-size="11.5" fill="#8b95a3">附可重播 ID</text>

  <line x1="620" y1="1015" x2="620" y2="978" stroke="#4a5563" stroke-width="1.5" marker-end="url(#arrowUp)"/>
  <text x="638" y="1000" font-size="11.5" fill="#6b7684">不可變基線快照（唯讀載入）</text>

  <!-- ========== 資料層 ========== -->
  <rect x="60" y="1020" width="1120" height="130" rx="14" fill="#16191c" stroke="#2a3038"/>
  <text x="84" y="1052" font-size="16" font-weight="600" fill="#e8ecf1">資料層　來源與雜湊全部公開</text>
  <rect x="84" y="1066" width="528" height="64" rx="10" fill="#1d2126" stroke="#2a3038"/>
  <text x="102" y="1094" font-size="13.5" fill="#e8ecf1">主辦方五份資料集　不可變基線</text>
  <text x="102" y="1116" font-size="12" fill="#8b95a3">交通流量 · 人流訊令 · 路網幾何 · 事件清單 · SOP 規則</text>
  <rect x="628" y="1066" width="528" height="64" rx="10" fill="#1d2126" stroke="#2a3038"/>
  <text x="646" y="1094" font-size="13.5" fill="#e8ecf1">臺北市官方 GIS　地圖資產補充</text>
  <text x="646" y="1116" font-size="12" fill="#8b95a3">號誌 47 處 · 人行道 19,643 筆 · 資訊可變標誌 178 面 · 醫院點位</text>

  <!-- ========== 稽核橫切面 ========== -->
  <rect x="1240" y="130" width="200" height="1020" rx="14" fill="#16191c" stroke="#007afc" stroke-opacity="0.35"/>
  <text x="1264" y="166" font-size="15" font-weight="600" fill="#007afc">稽核橫切面</text>
  <text x="1264" y="188" font-size="11.5" fill="#8b95a3">貫穿上述所有層</text>

  <rect x="1256" y="210" width="168" height="140" rx="10" fill="#1d2126" stroke="#2a3038"/>
  <text x="1274" y="266" font-size="13" fill="#e8ecf1">資料雜湊</text>
  <text x="1274" y="292" font-size="11" fill="#8b95a3">資料集 SHA256</text>
  <text x="1274" y="312" font-size="11" fill="#8b95a3">引擎常數公開</text>

  <rect x="1256" y="366" width="168" height="140" rx="10" fill="#1d2126" stroke="#2a3038"/>
  <text x="1274" y="422" font-size="13" fill="#e8ecf1">系統日誌</text>
  <text x="1274" y="448" font-size="11" fill="#8b95a3">六類 · 含每次</text>
  <text x="1274" y="468" font-size="11" fill="#8b95a3">LLM 呼叫紀錄</text>

  <rect x="1256" y="522" width="168" height="140" rx="10" fill="#1d2126" stroke="#2a3038"/>
  <text x="1274" y="578" font-size="13" fill="#e8ecf1">決策軌跡</text>
  <text x="1274" y="604" font-size="11" fill="#8b95a3">11 步完整記錄</text>
  <text x="1274" y="624" font-size="11" fill="#8b95a3">規則歸因三分類</text>

  <rect x="1256" y="678" width="168" height="140" rx="10" fill="#1d2126" stroke="#2a3038"/>
  <text x="1274" y="734" font-size="13" fill="#e8ecf1">證據契約</text>
  <text x="1274" y="760" font-size="11" fill="#8b95a3">情境與基線</text>
  <text x="1274" y="780" font-size="11" fill="#8b95a3">雙重雜湊</text>

  <rect x="1256" y="834" width="168" height="140" rx="10" fill="#1d2126" stroke="#2a3038"/>
  <text x="1274" y="890" font-size="13" fill="#e8ecf1">重播 ID</text>
  <text x="1274" y="916" font-size="11" fill="#8b95a3">同輸入</text>
  <text x="1274" y="936" font-size="11" fill="#8b95a3">必得同輸出</text>

  <rect x="1256" y="990" width="168" height="140" rx="10" fill="#1d2126" stroke="#2a3038"/>
  <text x="1274" y="1046" font-size="13" fill="#e8ecf1">稽核端點</text>
  <text x="1274" y="1072" font-size="11" fill="#8b95a3">五個獨立 API</text>
  <text x="1274" y="1092" font-size="11" fill="#8b95a3">可供外部驗證</text>

  <text x="60" y="1190" font-size="12.5" fill="#6b7684">所有模擬結果皆標記 production_state_modified: false — 模擬器在設計上不可變更生產狀態，且此約束由自動化測試守著，不依賴自律。</text>
</svg>
